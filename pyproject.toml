[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golem-sources"
version = "0.1.0"
description = "Clients for public data sources used by No Free Lunch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "No Free Lunch" }]
dependencies = ["httpx>=0.28"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["golem_sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network or API keys; skipped by default"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
